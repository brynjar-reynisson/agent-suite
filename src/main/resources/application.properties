spring.application.name=agent-suite
spring.profiles.default=${SPRING_PROFILES_ACTIVE:dev}

langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.chat-model.model-name=deepseek-v4-pro
langchain4j.open-ai.chat-model.temperature=0.1
langchain4j.open-ai.chat-model.max-tokens=8192
# Keep request/response logging OFF: langchain4j request logging includes the outbound
# Authorization: Bearer <provider-key> header. The chat models are built in code without
# logRequests, so no key currently leaks, but leaving these true is a latent landmine if a
# future change ever honors them. INFO (not DEBUG) also keeps conversation content out of logs.
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

logging.level.dev.langchain4j=INFO
logging.file.name=./logs/agent-suite.log

google.api-key=${GOOGLE_API_KEY:}
anthropic.api-key=${ANTHROPIC_API_KEY:}
mistral.api-key=${MISTRAL_AI_API_KEY:}
brave.api-key=${BRAVE_SEARCH_API_KEY:}

# MCP tool group
mcp.config.path=.mcp.json
mcp.call-timeout-seconds=90

# Audio serve tool
agent.base-url=http://localhost:8090
agent.audio.dir=./tmp_audio_files
agent.image.dir=./tmp_screenshot_files

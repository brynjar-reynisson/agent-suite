server.port=8091
spring.datasource.url=jdbc:postgresql://${SUPABASE_PROD_DB_HOST}:5432/postgres
spring.datasource.username=${SUPABASE_PROD_DB_USERNAME}
spring.datasource.password=${SUPABASE_PROD_DB_PASSWORD}
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=60000
supabase.jwt-secret=${SUPABASE_PROD_JWT_SECRET}
supabase.url=${SUPABASE_PROD_URL}

# Separate log file per environment so the concurrently-running dev and prod backends don't interleave.
logging.file.name=./logs/agent-suite-prod.log
agent.base-url=https://agent.breynisson.org

logging.file.name=logs/agent-test-suite.log

supabase.jwt-secret=test-secret-padded-to-at-least-32-characters
supabase.url=http://127.0.0.1:54321

google.api-key=
anthropic.api-key=
mistral.api-key=

langchain4j.open-ai.chat-model.base-url=https://api.deepseek.com/v1
langchain4j.open-ai.chat-model.model-name=deepseek-v4-pro
langchain4j.open-ai.chat-model.temperature=0.1
langchain4j.open-ai.chat-model.max-tokens=8192
langchain4j.open-ai.chat-model.log-requests=true
langchain4j.open-ai.chat-model.log-responses=true

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

mcp.root-config.enabled=false

agent.base-url=http://localhost:8090
agent.audio.dir=./tmp_audio_files
